<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#d9eff8">
    <title>Little sketchbook</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="sketchbook">
      <header>
        <h1>Little sketchbook<span aria-hidden="true">✳</span></h1>
        <button id="gallery-button" class="quiet-button icon-button" aria-label="My pictures" title="My pictures">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="16" height="16" rx="2"/><path d="M17 23H3a2 2 0 0 1-2-2V7M5 15l5-5 4 4 3-3 4 4"/><circle cx="16" cy="7" r="1"/></svg>
        </button>
      </header>

      <section class="drawing-area" aria-label="Drawing area">
        <div class="paper">
          <canvas id="canvas" width="1200" height="1200" aria-label="Draw here with your finger, pen, or mouse"></canvas>
        </div>
      </section>

      <footer>
        <div id="palette" class="palette" role="group" aria-label="Paint colors"></div>
        <div class="actions">
          <button id="new-button" class="quiet-button icon-button" aria-label="New page" title="New page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M12 12v6M9 15h6"/></svg>
          </button>
          <p id="status" role="status">Make something yours.</p>
          <button id="save-button" class="save-button icon-button" aria-label="Keep picture" title="Keep picture">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
          </button>
        </div>
      </footer>
    </main>

    <dialog id="gallery" aria-label="My pictures">
      <div class="gallery-heading">
        <h2>My Pictures</h2>
        <button id="close-gallery" class="quiet-button icon-button" aria-label="Close pictures" title="Close pictures">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="pictures" class="pictures"></div>
    </dialog>
  </body>
</html>
