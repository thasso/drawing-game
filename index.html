<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sketchbook">
    <title>Little sketchbook</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="./icons/sketchbook.svg">
    <link rel="stylesheet" href="./style.css">
    <script src="./coloring.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="sketchbook">
      <header class="top-bar">
        <button id="gallery-button" class="quiet-button icon-button" aria-label="My pictures" title="My pictures">
          <svg class="paint-icon" viewBox="0 0 40 40" fill="none" stroke="#263f54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="8" width="27" height="27" rx="4" fill="#accfdf" transform="rotate(-10 18 21)"/>
            <rect x="10" y="5" width="27" height="29" rx="4" fill="white"/>
            <circle cx="29" cy="13" r="4" fill="#f3ce45"/>
            <path d="m11 26 8-9 7 7 4-4 6 6v5a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2Z" fill="#57ad74"/>
          </svg>
        </button>
        <h1>Little sketchbook<span aria-hidden="true">✳</span></h1>
        <div class="picture-actions">
          <button id="undo-delete" class="quiet-button icon-button" aria-label="Undo delete" title="Undo delete" hidden>
            <svg class="paint-icon" viewBox="0 0 40 40" fill="none" stroke="#263f54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 12h9c9 0 13 7 11 14s-8 10-17 9v-6c6 1 10-1 11-5s-1-6-5-6h-9v7L4 15 16 4Z" fill="#57ad74"/>
              <path d="M25 15q9 1 8 9" stroke="white"/>
            </svg>
          </button>
          <template id="delete-icon">
            <svg class="paint-icon" viewBox="0 0 40 40" fill="none" stroke="#263f54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m10 14 2 22h16l2-22Z" fill="#ec8fba"/>
              <path d="M15 9V5h10v4" fill="#f3ce45"/>
              <rect x="6" y="9" width="28" height="6" rx="3" fill="#f3ce45"/>
              <path d="M16 21v9M24 21v9"/>
            </svg>
          </template>
        </div>
      </header>

      <section class="drawing-area" aria-label="Drawing area">
        <div class="paper">
          <canvas id="canvas" width="1200" height="1200" aria-label="Draw here with your finger, pen, or mouse. Pinch with two fingers to zoom."></canvas>
        </div>
        <p id="status" role="status"></p>
        <canvas id="brush-cursor" width="256" height="256" aria-hidden="true" hidden></canvas>
      </section>

      <nav class="dock" aria-label="Drawing tools">
        <button id="undo-stroke" class="dock-button" aria-label="Undo stroke" title="Undo stroke" disabled>
          <svg class="paint-icon" viewBox="0 0 40 40" fill="none" stroke="#263f54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M34 30A14 14 0 1 0 8 23H3l8 10 8-10h-5a8 8 0 1 1 15 4Z" fill="#f49b38"/>
            <path d="M27.5 13.5a11 11 0 0 0-11 0" stroke="white"/>
            <circle cx="22" cy="23" r="3.5" fill="#499cde"/>
          </svg>
        </button>
        <button id="brush-button" class="dock-button" aria-label="Brushes" title="Brushes" aria-expanded="false" aria-controls="brush-sheet">
          <svg class="paint-icon" viewBox="0 0 40 40" fill="none" stroke="#263f54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m18 19 12-13a4 4 0 0 1 6 6L23 24Z" fill="#f3ce45"/>
            <path d="m16 18 9 9-5 5-9-9Z" fill="#accfdf"/>
            <path d="M12 23C4 24 9 31 3 34c9 5 20-1 16-8Z" fill="var(--paint, #499cde)"/>
            <path d="M9 33q5 0 6-4" stroke="white"/>
          </svg>
        </button>
        <div id="brush-sheet" class="sheet" hidden>
          <div id="brushes" class="brushes" role="group" aria-label="Brush types"></div>
        </div>
        <button id="properties-button" class="dock-button" aria-label="Brush size and opacity" title="Brush size and opacity" aria-expanded="false" aria-controls="properties-sheet">
          <svg class="paint-icon" viewBox="0 0 40 40" fill="none" stroke="#263f54" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 9S3 17 3 21a6 6 0 0 0 12 0c0-4-6-12-6-12Z" fill="#499cde" fill-opacity="0.3"/>
            <path d="M26 4S16 17 16 25a10 10 0 0 0 20 0C36 17 26 4 26 4Z" fill="#499cde"/>
            <path d="M21 26q0 5 5 5" stroke="white" stroke-width="2.5"/>
          </svg>
        </button>
        <div id="properties-sheet" class="sheet" hidden>
          <div class="brush-controls">
            <canvas id="brush-preview" class="brush-preview" width="240" height="240" role="img" aria-label="Brush preview"></canvas>
            <div class="brush-sliders">
              <label class="brush-control" title="Brush size">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="4" cy="12" r="2"/><circle cx="17" cy="12" r="6"/></svg>
                <input id="brush-size" type="range" min="4" max="100" step="2" value="16" aria-label="Brush size">
              </label>
              <label class="brush-control" title="Opacity">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2S4 10 4 15a8 8 0 0 0 16 0c0-5-8-13-8-13Z"/><path d="M12 2v21a8 8 0 0 0 8-8c0-5-8-13-8-13Z" fill="currentColor" stroke="none"/></svg>
                <input id="brush-opacity" type="range" min="10" max="100" step="5" value="100" aria-label="Opacity">
              </label>
            </div>
          </div>
          <div id="amounts" class="amounts" role="group" aria-label="How many shapes" hidden></div>
        </div>
        <button id="color-button" class="dock-button" aria-label="Colors" title="Colors" aria-expanded="false" aria-controls="color-sheet">
          <span class="current-color" aria-hidden="true"></span>
        </button>
        <div id="color-sheet" class="sheet" hidden>
          <div id="palette" class="palette" role="group" aria-label="Paint colors"></div>
        </div>
        <button id="fit-button" class="dock-button" aria-label="Show whole page" title="Show whole page" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8V3h5M21 8V3h-5M3 16v5h5M21 16v5h-5"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg>
        </button>
      </nav>
    </main>

    <dialog id="page-picker" aria-labelledby="page-picker-title">
      <div class="gallery-heading">
        <h2 id="page-picker-title">Pick a page</h2>
        <button id="close-page-picker" class="quiet-button icon-button" aria-label="Close page picker" title="Close page picker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="page-choices" class="page-choices"></div>
    </dialog>

    <dialog id="gallery" aria-label="My pictures">
      <div class="gallery-heading">
        <h2>My Pictures</h2>
        <div class="picture-actions">
          <button id="undo-gallery-delete" class="quiet-button icon-button" aria-label="Undo delete" title="Undo delete" hidden>
            <svg class="paint-icon" viewBox="0 0 40 40" fill="none" stroke="#263f54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16 12h9c9 0 13 7 11 14s-8 10-17 9v-6c6 1 10-1 11-5s-1-6-5-6h-9v7L4 15 16 4Z" fill="#57ad74"/>
              <path d="M25 15q9 1 8 9" stroke="white"/>
            </svg>
          </button>
          <button id="close-gallery" class="quiet-button icon-button" aria-label="Close pictures" title="Close pictures">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </div>
      <div id="pictures" class="pictures">
        <button id="new-button" class="picture new-picture" aria-label="New page" title="New page">
          <svg class="paint-icon" viewBox="0 0 40 40" fill="none" stroke="#263f54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 4h15l8 8v21a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" fill="white"/>
            <path d="M24 4v8h8" fill="#accfdf"/>
            <circle cx="25" cy="26" r="10" fill="#57ad74"/>
            <path d="M25 21v10M20 26h10" stroke="white" stroke-width="3"/>
          </svg>
        </button>
      </div>
    </dialog>
  </body>
</html>
